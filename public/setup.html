<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Setup</title>
  <style>
    :root { --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --accent: #0071e3; --bad: #d70015; --ok: #248a3d; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: #38383a; --accent: #0a84ff; --bad: #ff453a; --ok: #30d158; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font: 16px/1.45 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
    h1 { font-size: 24px; margin: 4px 0 0; }
    .lead { color: var(--muted); margin: 0; }
    .card { background: var(--card); border-radius: 14px; padding: 16px; }
    ol { margin: 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 16px; }
    ol > li { counter-increment: step; display: grid; grid-template-columns: 28px 1fr; gap: 12px; }
    ol > li::before { content: counter(step); width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; }
    .path { font-weight: 600; }
    .btn { display: block; width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
    .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .muted { color: var(--muted); font-size: 14px; }
    #result { margin: 8px 0 0; font-weight: 600; }
    #result.ok { color: var(--ok); }
    #result.bad { color: var(--bad); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Enable Save to Photos</h1>
  <p class="lead">A one-time setup so this phone can open the secure version of the page. Your phone will then trust only this PC's transfer page.</p>

  <div class="card">
    <ol id="steps"></ol>
  </div>

  <p class="muted">To undo it later: <span id="undo"></span></p>
  <p class="muted"><a id="back" href="/">← Back without setting up</a></p>
</main>

<script>
  const HTTPS_PORT = Number('{{HTTPS_PORT}}');
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const secureUrl = `https://${location.hostname}:${HTTPS_PORT}/${location.search}`;
  document.getElementById('back').href = `/${location.search}`;

  const download = '<a class="btn" href="/setup/ca.crt">Download certificate</a>';
  const test = `<button class="btn" id="test">Test and continue</button><p id="result" role="status"></p>`;

  const steps = isIOS ? [
    `Tap the button below, then tap <b>Allow</b>. Safari says a configuration profile was downloaded. ${download}`,
    `Open <span class="path">Settings</span>. Tap <span class="path">Profile Downloaded</span> near the top (or <span class="path">General › VPN &amp; Device Management</span>), then tap <b>Install</b> and enter your passcode.`,
    `Go to <span class="path">Settings › General › About › Certificate Trust Settings</span> and switch on <b>Phone Transfer CA</b>. Without this step it won't work.`,
    `Come back to Safari and tap: ${test}`,
  ] : [
    `Tap the button below to download the certificate. ${download}`,
    `Open <span class="path">Settings</span> and search for <b>“CA certificate”</b> (usually <span class="path">Security › More security settings › Encryption &amp; credentials › Install a certificate › CA certificate</span>). Tap <b>Install anyway</b> and choose <b>Phone-Transfer-CA.crt</b> from Downloads.`,
    `Come back to Chrome and tap: ${test}`,
  ];
  document.getElementById('steps').innerHTML = steps.map((s) => `<li><div>${s}</div></li>`).join('');
  document.getElementById('undo').textContent = isIOS
    ? 'Settings › General › VPN & Device Management › Phone Transfer CA › Remove Profile.'
    : 'Settings › Security › Encryption & credentials › User credentials › Phone Transfer CA › Remove.';

  // If the phone trusts the certificate, the secure page answers; otherwise the request fails.
  document.getElementById('test').addEventListener('click', async () => {
    const result = document.getElementById('result');
    result.className = '';
    result.textContent = 'Checking…';
    try {
      const res = await fetch(`https://${location.hostname}:${HTTPS_PORT}/api/ping`, { cache: 'no-store' });
      if (!res.ok) throw new Error();
      result.className = 'ok';
      result.textContent = 'Done! Opening the secure page…';
      setTimeout(() => location.replace(secureUrl), 600);
    } catch {
      result.className = 'bad';
      result.textContent = isIOS
        ? 'Not trusted yet. Check step 3: the switch in Certificate Trust Settings must be on.'
        : 'Not trusted yet. Make sure the certificate was installed as a CA certificate.';
    }
  });
</script>
</body>
</html>
